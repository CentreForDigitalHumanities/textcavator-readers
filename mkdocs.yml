site_name: Textcavator Readers
repo_url: https://github.com/CentreForDigitalHumanities/ianalyzer-readers
plugins:
  - mkdocstrings
nav:
  - 'index.md'
  - 'usage.md'
  - Examples:
    - 'example_csv.md'
    - 'example_xml.md'
    - 'example_custom.md'
  - API:
    - 'api/core.md'
    - 'api/readers.md'
    - 'api/extractors.md'
    - 'api/utilities.md'
theme:
  name: readthedocs
extra_css:
  - style.css
watch:
  - docs
  - textcavator_readers
plugins:
- mkdocstrings:
    handlers:
      python:
        options:
          show_bases: true
          show_root_toc_entry: false
          heading_level: 3
